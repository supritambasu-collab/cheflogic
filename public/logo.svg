<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e2ad" />
      <stop offset="45%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#9a7428" />
    </linearGradient>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16181b" />
      <stop offset="100%" stop-color="#0c0d0e" />
    </linearGradient>
  </defs>

  <!-- Emblem Icon Mark -->
  <g transform="translate(10, 8)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#logoBg)" stroke="#c5a059" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Base band -->
    <rect x="18" y="44" width="28" height="5" rx="1.5" fill="url(#logoGold)" />
    <line x1="20" y1="46.5" x2="44" y2="46.5" stroke="#0c0d0e" stroke-width="1" stroke-linecap="round" />

    <!-- Crown -->
    <path d="M22 41 C20 33, 13 32, 16 23 C18 16, 27 18, 30 25 C31 16, 33 16, 34 25 C37 18, 46 16, 48 23 C51 32, 44 33, 42 41 Z" 
          fill="none" 
          stroke="url(#logoGold)" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Flutes -->
    <path d="M32 25 L32 41" stroke="url(#logoGold)" stroke-width="2" stroke-linecap="round" />
    <path d="M25 29 C26 34, 26 37, 27 41" stroke="url(#logoGold)" stroke-width="1.6" stroke-linecap="round" />
    <path d="M39 29 C38 34, 38 37, 37 41" stroke="url(#logoGold)" stroke-width="1.6" stroke-linecap="round" />

    <!-- Diamond Top -->
    <polygon points="32,13 35,17 32,21 29,17" fill="url(#logoGold)" />
  </g>

  <!-- Typography Wordmark -->
  <text x="88" y="46" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="600" fill="#ede8df" letter-spacing="1.5">Chef<tspan fill="url(#logoGold)">Logic</tspan></text>
  
  <!-- Subtitle Tag -->
  <text x="90" y="62" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#c5a059" letter-spacing="2.8">CULINARY INTELLIGENCE</text>
</svg>
